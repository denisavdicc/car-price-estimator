{% extends "layout.html" %}

{% block title %} - Register{% endblock %}

{% block body %}
<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h2 class="text-center mb-3">Register</h2>
            <p class="text-center text-muted mb-4">Enter your username and password.</p>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form action="/register" method="post">
                <div class="mb-3">
                    <input autocomplete="off" autofocus class="form-control" name="username" placeholder="Username" type="text">
                </div>

                <div class="mb-3">
                    <input id="password" class="form-control" name="password" placeholder="Password" type="password" minlength="8">
                </div>

                <div class="mb-3">
                    <input id="confirmation" class="form-control" name="confirmation" placeholder="Confirm Password" type="password" minlength="8">
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="showPassword">
                    <label class="form-check-label" for="showPassword">Show Password</label>
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary" type="submit">Register</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById("showPassword").addEventListener("change", function (){
    const password = document.getElementById("password");
    const confirmation = document.getElementById("confirmation");
    if(this.checked){
        password.type = "text";
        confirmation.type = "text";
    }
    else{
        password.type = "password";
        confirmation.type = "password";
    }
});
</script>
{% endblock %}
