{% extends "layout.html" %}

{% block title %} - Change Password{% endblock %}

{% block body %}
<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">

            <h2 class="text-center mb-3">Change Password</h2>
            <p class="text-center text-muted mb-4">Enter your old and new password.</p>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form action="/change_password" method="post">
                <div class="mb-3">
                    <input class="form-control" name="old_password" placeholder="Old Password" type="password" minlength="8">
                </div>
                <div class="mb-3">
                    <input class="form-control" name="new_password" placeholder="New Password" type="password" minlength="8">
                </div>
                <div class="mb-3">
                    <input class="form-control" name="confirmation" placeholder="Confirm New Password" type="password" minlength="8">
                </div>
                <button class="btn btn-primary" type="submit">Change Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
